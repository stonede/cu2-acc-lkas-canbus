[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 460800
build_type = debug
extra_scripts = pre:tools/git_version.py
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
build_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<honda_serial_protocol.cpp>
    +<frame_parser.cpp>
    +<json_records.cpp>
build_flags =
    -std=c++14
    -Wall
    -Wextra
    -Werror
